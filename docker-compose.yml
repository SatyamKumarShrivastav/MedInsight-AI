version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medinsight-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: medinsight_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medinsight-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: medinsight_ai
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./datasets:/app/datasets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medinsight-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
